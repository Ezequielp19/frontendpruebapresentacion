<div class="modal-overlay" (click)="cerrarModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h2 class="modal-title">
        <mat-icon>lock</mat-icon>
        Cambiar Contraseña
      </h2>
      <button class="btn-close" (click)="cerrarModal()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="passwordForm" class="password-form">
        <!-- Contraseña Actual -->
        <div class="form-group">
          <label for="contrasenaActual">
            <mat-icon>lock_outline</mat-icon>
            Contraseña Actual
          </label>
          <div class="input-wrapper">
            <input
              [type]="mostrarContrasenas.actual ? 'text' : 'password'"
              id="contrasenaActual"
              formControlName="contrasenaActual"
              placeholder="Ingresa tu contraseña actual"
              class="form-input"
              [class.error]="passwordForm.get('contrasenaActual')?.invalid && passwordForm.get('contrasenaActual')?.touched">
            <button
              type="button"
              class="btn-toggle-password"
              (click)="toggleMostrarContrasena('actual')">
              <mat-icon>{{ mostrarContrasenas.actual ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
          <span class="error-message" *ngIf="passwordForm.get('contrasenaActual')?.invalid && passwordForm.get('contrasenaActual')?.touched">
            {{ getErrorMessage('contrasenaActual') }}
          </span>
        </div>

        <!-- Nueva Contraseña -->
        <div class="form-group">
          <label for="nuevaContrasena">
            <mat-icon>lock</mat-icon>
            Nueva Contraseña
          </label>
          <div class="input-wrapper">
            <input
              [type]="mostrarContrasenas.nueva ? 'text' : 'password'"
              id="nuevaContrasena"
              formControlName="nuevaContrasena"
              placeholder="Ingresa tu nueva contraseña"
              class="form-input"
              [class.error]="passwordForm.get('nuevaContrasena')?.invalid && passwordForm.get('nuevaContrasena')?.touched">
            <button
              type="button"
              class="btn-toggle-password"
              (click)="toggleMostrarContrasena('nueva')">
              <mat-icon>{{ mostrarContrasenas.nueva ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
          <span class="error-message" *ngIf="passwordForm.get('nuevaContrasena')?.invalid && passwordForm.get('nuevaContrasena')?.touched">
            {{ getErrorMessage('nuevaContrasena') }}
          </span>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="form-group">
          <label for="confirmarContrasena">
            <mat-icon>lock</mat-icon>
            Confirmar Nueva Contraseña
          </label>
          <div class="input-wrapper">
            <input
              [type]="mostrarContrasenas.confirmar ? 'text' : 'password'"
              id="confirmarContrasena"
              formControlName="confirmarContrasena"
              placeholder="Confirma tu nueva contraseña"
              class="form-input"
              [class.error]="passwordForm.get('confirmarContrasena')?.invalid && passwordForm.get('confirmarContrasena')?.touched">
            <button
              type="button"
              class="btn-toggle-password"
              (click)="toggleMostrarContrasena('confirmar')">
              <mat-icon>{{ mostrarContrasenas.confirmar ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
          <span class="error-message" *ngIf="passwordForm.get('confirmarContrasena')?.invalid && passwordForm.get('confirmarContrasena')?.touched">
            {{ getErrorMessage('confirmarContrasena') }}
          </span>
        </div>

        <!-- Info -->
        <div class="info-box">
          <mat-icon>info</mat-icon>
          <p>La contraseña debe tener al menos 6 caracteres. Asegúrate de usar una contraseña segura.</p>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-cancel" (click)="cerrarModal()">
        <mat-icon>close</mat-icon>
        Cancelar
      </button>
      <button
        class="btn-save"
        (click)="guardarCambios()"
        [disabled]="passwordForm.invalid">
        <mat-icon>save</mat-icon>
        Cambiar Contraseña
      </button>
    </div>
  </div>
</div>
